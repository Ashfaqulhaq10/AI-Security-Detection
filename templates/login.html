<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Fusion Login - Light Theme</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f7f9;
      --panel: #ffffff;
      --input-bg: #f0f4f7;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #1f2937;
      --muted: #6b7280;
      --radius: 14px;
      --shadow: 0 10px 30px rgba(0,0,0,0.1);
      --font: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body, html {
      width: 100%;
      height: 100%;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      display: flex;
      width: 80vw;
      max-width: 1100px;
      height: 70vh;
      min-height: 550px;
      background: var(--panel);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid #e5e7eb;
    }

    .visual-panel {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;
      background: #000;
      position: relative;
      overflow: hidden;
    }

    .visual-panel::before,
    .visual-panel::after {
      display: none;
    }

    .image-placeholder {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border: none;
        border-radius: 0;
    }

    .image-placeholder img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border: none;
        border-radius: 0;
    }

    /* SpaceX-style V12 text in top-left corner */
    .image-placeholder .overlay-text {
        position: absolute;
        top: 25px;
        left: 30px;
        font-family: 'Orbitron', sans-serif;
        font-weight: 900;
        font-size: 48px;
        letter-spacing: 3px;
        color: #ffffff;
        text-transform: uppercase;
        text-shadow: 0 0 15px rgba(99,102,241,0.6);
        background: linear-gradient(90deg, #ffffff, #a3b3ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .form-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px;
      background: var(--panel);
      border-left: 1px solid #e5e7eb;
    }

    .form-title {
      font-size: 28px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    .form-subtitle {
      font-size: 16px;
      color: var(--muted);
      margin-bottom: 40px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
    }

    .text-input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      background: var(--input-bg);
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .text-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .login-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4);
    }

    .forgot-password {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }

    .forgot-password a {
      color: var(--accent);
      text-decoration: none;
      transition: color 0.2s;
    }
    .forgot-password a:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 20px;
      margin: 30px 0 20px;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: #d1d5db;
    }

    .divider-text {
      color: var(--muted);
      font-size: 14px;
    }

    .social-buttons {
      display: flex;
      gap: 12px;
    }

    .social-btn {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      background: var(--panel);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      transition: all 0.2s ease;
    }

    .social-btn:hover {
      background: var(--input-bg);
      border-color: var(--accent);
    }

    @media (max-width: 900px) {
      .visual-panel {
        display: none;
      }
      .login-container {
        width: 90vw;
        max-width: 500px;
        height: auto;
      }
      .form-panel {
        padding: 40px 30px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    
    <div class="visual-panel">
      <div class="image-placeholder">
        <img src="login.jpg" alt="Login Illustration">
        <div class="overlay-text">V12</div>
      </div>
    </div>
    
    <div class="form-panel">
      <h1 class="form-title">Welcome Back</h1>
      <p class="form-subtitle">Sign in to continue your session.</p>

      <form action="#" method="POST">
        <div class="input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="text-input" placeholder="Enter your email" required>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="text-input" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="login-btn">
          Log In
        </button>
      </form>

      <div class="forgot-password">
        <a href="#">Forgot Password?</a>
      </div>

      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">or continue with</span>
        <div class="divider-line"></div>
      </div>

      <div class="social-buttons">
        <button type="button" class="social-btn">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
            <path d="M9.003 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.96v2.332C2.44 15.983 5.485 18 9.003 18z" fill="#34A853"/>
            <path d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71 0-.593.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
            <path d="M9.003 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.464.891 11.426 0 9.003 0 5.485 0 2.44 2.017.96 4.958L3.967 7.29c.708-2.127 2.692-3.71 5.036-3.71z" fill="#EA4335"/>
          </svg>
          Google
        </button>

        <button type="button" class="social-btn">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
          </svg>
          GitHub
        </button>
      </div>

    </div>

  </div>
</body>
</html>
